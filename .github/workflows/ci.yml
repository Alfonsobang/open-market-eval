name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m open_market_eval doctor --output runs/doctor.json
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: project-integrity-report
          path: runs/doctor.json
      - run: python -m open_market_eval demo --output runs/demo
      - run: python -m open_market_eval build-site --output site
      - run: node tools/check_site_js.mjs site/index.html site/research-audit.html site/filing-qa.html
      - run: python -m unittest discover -s integrations/harbor/market-forecast/tests -v
      - run: python -m unittest discover -s integrations/harbor/a-share-backtest-audit/tests -v
      - run: python -m unittest discover -s integrations/harbor/a-share-point-in-time-qa/tests -v
      - run: python -m unittest discover -s integrations/harbor/a-share-research-evidence/tests -v

  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_skill.py skills/forecast-market-events
