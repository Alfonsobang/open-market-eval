name: Live submission integrity

on:
  push:
    paths:
      - "live/**"
      - "open_market_eval/**"
      - ".github/workflows/live-submissions.yml"
  pull_request:
    paths:
      - "live/**"
      - "open_market_eval/**"
      - ".github/workflows/live-submissions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m open_market_eval verify-live
