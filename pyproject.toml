[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-market-eval"
version = "0.7.0"
description = "A-Share quality gates for filings, backtests, financial-search evidence, and research agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "OpenMarketEval contributors"}]
keywords = ["a-share", "finance", "agent-evaluation", "backtest", "financial-search", "harbor", "llm", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
open-market-eval = "open_market_eval.cli:main"

[tool.setuptools]
packages = ["open_market_eval"]
