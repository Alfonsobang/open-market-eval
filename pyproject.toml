[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-market-eval"
version = "0.3.0"
description = "Public A-share research Agent Lab with time-safe, auditable evaluation tracks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "OpenMarketEval contributors"}]
keywords = ["a-share", "finance", "evaluation", "llm", "agents", "backtest", "forecasting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
open-market-eval = "open_market_eval.cli:main"

[tool.setuptools]
packages = ["open_market_eval"]
