[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-market-eval"
version = "0.2.0"
description = "Auditable evaluation harness for AI market and major-event forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "OpenMarketEval contributors"}]
keywords = ["forecasting", "finance", "evaluation", "llm", "agents", "calibration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
open-market-eval = "open_market_eval.cli:main"

[tool.setuptools]
packages = ["open_market_eval"]
